<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DOMI Reservation Forms</title>
  </head>
  <body>
    <form name="domi-reservation" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="domi-reservation" />
      <input name="bot-field" />
      <input name="product" />
      <input name="name" />
      <input name="phone" />
      <input name="wechat" />
      <input name="quantity" />
      <input name="delivery" />
      <input name="enterprise" />
      <textarea name="note"></textarea>
      <input name="source" />
      <input name="submittedAt" />
    </form>
  </body>
</html>
